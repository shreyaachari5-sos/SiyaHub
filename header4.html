<!DOCTYPE html>
<html>
<head>
    <title>SiyaHub Header</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: #f5f9ff;
            overflow: hidden;
        }

        /* Header */
        .header {
            height: 90px;
            width: 100%;
            background-color: #008c95;
            color: white;
            display: flex;
            align-items: center;
            padding: 0 15px;
            gap: 12px;
        }

        /* Logo */
        .brand {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 220px;
            flex-shrink: 0;
        }

        .brand img {
            width: 50px;
            height: 50px;
            background: white;
            padding: 3px;
            border-radius: 6px;
            object-fit: contain;
            flex-shrink: 0;
        }

        .brand h1 {
            margin: 0;
            font-size: 25px;
        }

        .brand p {
            margin: 3px 0 0;
            font-size: 11px;
            white-space: nowrap;
        }

        /* Search */
        .search {
            display: flex;
            height: 38px;
            flex: 1;
            min-width: 0;
        }

        .search select {
            width: 65px;
            flex-shrink: 0;
            border: none;
            background: white;
            padding: 0 5px;
            border-radius: 4px 0 0 4px;
        }

        .search input {
            flex: 1;
            width: 100%;
            min-width: 0;
            border: none;
            outline: none;
            background: #e6e6e6;
            padding: 0 10px;
            font-size: 14px;
        }

        .search button {
            width: 42px;
            flex-shrink: 0;
            border: none;
            background: #febd69;
            font-size: 18px;
            cursor: pointer;
        }

        /* Login and Cart */
        .actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .login, .cart {
            display: inline-block;
            color: white;
            text-decoration: none;
            font-size: 13px;
            font-weight: bold;
            border: 1px solid white;
            padding: 8px 10px;
            border-radius: 5px;
            white-space: nowrap;
        }

        .login:hover, .cart:hover {
            background: white;
            color: #131921;
        }

        /* Navigation */
        .nav {
            height: 42px;
            width: 100%;
            background: white;
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 0 8px;
            gap: 8px;
        }

        .nav a {
            color: black;
            text-decoration: none;
            text-align: center;
            font-size: 12px;
            font-weight: bold;
        }

        .nav a:hover {
            text-decoration: underline;
        }

        /* Marquee */
        .sale {
            height: 32px;
            width: 100%;
            background: #33a6ad;
            color: #000000;
            display: flex;
            align-items: center;
            font-size: 15px;
            font-weight: bold;
        }

        .sale marquee {
            width: 100%;
        }

        /* Mobile Screen */
        @media (max-width: 700px) {
            .header {
                height: 60px;
                padding: 0 5px;
                gap: 6px;
            }

            .brand {
                width: auto;
                gap: 4px;
            }

            .brand img {
                width: 35px;
                height: 35px;
            }

            .brand h1 {
                font-size: 16px;
            }

            .brand p {
                font-size: 8px;
                white-space: normal;
            }

            .search {
                height: 30px;
                min-width: 0;
            }

            .search select {
                display: none;
            }

            .search input {
                padding: 0 4px;
                font-size: 10px;
            }

            .search button {
                width: 27px;
                font-size: 13px;
            }

            .actions {
                gap: 4px;
            }

            .login, .cart {
                font-size: 10px;
                padding: 6px 4px;
            }

            .nav {
                height: 30px;
                padding: 0 4px;
                gap: 4px;
            }

            .nav a {
                font-size: 10px;
            }

            .sale {
                height: 24px;
                font-size: 11px;
            }
        }
    </style>
</head>

<body>

    <div class="header">

        <div class="brand">
            <img src="logo.png" alt="SiyaHub Logo">

            <div>
                <h1>SiyaHub</h1>
                <p>Smart Tech.Better Choice.</p>
            </div>
        </div>

        <div class="search">
            <select>
                <option>All</option>
                <option>Mobiles</option>
                <option>Tablets</option>
            </select>

            <input type="text"
                   placeholder="Search Mobiles and Tablets">

            <button type="button">🔍</button>
        </div>

        <div class="actions">
            <a href="login4.html"
               target="_top"
               class="login">🚹 Login</a>

            <a href="products4.html"
               target="content"
               class="cart">🛒 Cart</a>
        </div>

    </div>

    <div class="nav">
        <a href="home4.html" target="content">🏠 Home</a>

        <a href="products4.html" target="content">
            🧑‍🤝‍🧑 Today's Deals
        </a>

        <a href="products4.html#mobiles" target="content">
            📱 Mobiles
        </a>

        <a href="products4.html#tablets" target="content">
            💻 Tablets
        </a>

        <a href="customer4.html" target="content">
            ℹ️ About Us
        </a>
    </div>

    <div class="sale">
        <marquee>
            <b>
                ||🔥 BIG SALE! UP TO 50% OFF ON MOBILES AND TABLETS||
                🚚 FREE DELIVERY||
                🎁 SPECIAL OFFERS AVAILABLE||
                ⚡ LIMITED TIME OFFER||
            </b>
        </marquee>
    </div>

</body>
</html>
