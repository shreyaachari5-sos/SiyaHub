<!DOCTYPE html>
<html>
  <head>
    <title>SiyaHub Header</title>
    <style>
        html,body{
            margin:0;
            font-family:Arial,sans-serif;
            overflow: hidden;
            background: #f5f9ff;
        }
        .header{
            height:85px;
            color:white;
            background-color: #008c95;
            display:flex;
            align-items:center;
            padding:0 18px;
            gap:18px;
            box-sizing:border-box;
        }
        .brand{
            display:flex;
            align-items:center;
            gap:8px;
            width:220px;
        }

        .brand img{
          margin-left: 10px;
            width:55px;
            height:55px;
            background:white;
            padding:3px;
            border-radius:6px;
            object-fit:contain;
        }

        .brand h1{
            margin:0;
            font-size:25px;
        }

        .brand p{
            margin:3px 0 0;
            font-size:11px;
        }
        .search{
            display:flex;
            height:38px;
            width: 900px;
            margin-left: 30px;
            
        }

        .search select{
            width:75px;
            border:none;
            background:white;
            padding:0px 8px;
            border-radius:4px 0 0 4px;
        }

        .search input{
            width: 700px;
            border:none;
            padding:0 12px;
            font-size:15px;
            outline:none;
           background:#e6e6e6;
        }

        .search button{
            width:80px;
            border:none;
            background:#febd69;
            font-size:19px;
            border-radius:0 4px 4px 0;
            cursor:pointer;
        }
        .login{
          color:white;
          text-decoration: none;
          font-size: 14px;
          font-weight: bold;
          border: 1px solid white;
          padding: 4px 40px;
          border-radius: 5px;
          transition:0.3s;
        }
        .login:hover{
          background: white;
          color: #131921;
        }
        .cart{
          color: white;
          font-size: 14px;
          font-weight: bold;
          border: 1px solid white;
          padding: 4px 40px;
          border-radius: 5px;
          cursor: pointer;
        }
        .cart:hover{
          background: white;
          color:#131921;
        }
        .actions{
            display:flex;
            align-items:center;
            gap:18px;
            white-space:nowrap;
        }
        .actions a,
        .actions span{
            color:white;
            text-decoration:none;
            font-weight:bold;
            font-size:14px;
        }
        .nav{
            height:42px;
            background:white;
            display:flex;
            align-items:center;
            justify-content: center;
            gap:28px;
            padding:0 30px;
            box-sizing:border-box;
            text-align: center;
        }

        .nav a{
            color:black;
            text-decoration:none;
            font-size:14px;
            font-weight:bold;
            margin:0 50px;
        }

        .nav a:hover{
            text-decoration:underline;
        }
        .sale{
            height:32px;
            background: #33a6ad;
            color:#000000;
            display:flex;
            align-items:center;
            font-size:15px;
            font-weight:bold;
        }

        .sale marquee{
            width:100%;
        }
    </style>
  </head>
  <body>
    <div class="header">
      <div class="brand">
        <img src="logo.png" alt="SiyaHub Logo">
          <div>
            <h1>SiyaHub</h1>
            <p>Smart Tech.Better Choice.</p>
          </div>
        </div>
        <div class="search">
          <select>
            <option>All</option>
            <option>Mobiles</option>
            <option>Tablets</option>
          </select>
          <input type="text"
            placeholder="Search Mobiles and Tablets">
            <button>🔍</button>
          </div>
          <div class="actions">
            <a href="login4.html" target="_top" class="login">
              🚹 Login
            </a>
          </div>
          <div class="cart">
            <span>🛒 Cart</span>
          </div>
        </div>
        <div class="nav">
          <a href="home4.html" target="content">
           🏠 Home
          </a>
          <a href="products4.html" target="content">
           🧑‍🤝‍🧑 Today's Deals
          </a>
          <a href="products4.html#mobiles" target="content">
            📱 Mobiles
          </a>
          <a href="products4.html#tablets" target="content">
            💻 Tablets
          </a>
          <a href="customer4.html" target="content">
            ℹ️ About Us
          </a>
        </div>
        <div class="sale">
          <marquee>
            <b>
            ||🔥 BIG SALE! UP TO 50% OFF ON MOBILES AND TABLETS||
            🚚 FREE DELIVERY||
            🎁 SPECIAL OFFERS AVAILABLE||
            ⚡ LIMITED TIME OFFER||
            </b>
          </marquee>
        </div>
      </body>
    </html>
