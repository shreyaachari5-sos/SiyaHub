<!DOCTYPE html>
<html>
  <head>
    <title>SiyaHub - Login</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #eaf2ff, #f8fbff);
        }

        .header {
            background: linear-gradient(135deg, #102c8c, #1769e8);
            color: white;
            padding: 15px 30px;
            display: flex;
            align-items: center;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand img {
            width: 70px;
            height: 70px;
            background: white;
            padding: 5px;
            border-radius: 10px;
            object-fit: contain;
        }

        .brand h1 {
            margin: 0;
            font-size: 28px;
        }

        .brand p {
            margin: 4px 0;
            font-size: 13px;
        }

        
        .login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 75vh;
        }

        .login-box {
            width: 380px;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 5px 20px #bbb;
            text-align: center;
        }

        .login-box h2 {
            color: #1769e8;
            margin-bottom: 8px;
        }

        .login-box p {
            color: #777;
            margin-bottom: 25px;
        }

        .login-box input {
            width: 100%;
            padding: 13px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
            outline: none;
        }

        .login-box input:focus {
            border-color: #1769e8;
        }

        .login-btn {
            width: 100%;
            padding: 13px;
            margin-top: 15px;
            border: none;
            border-radius: 6px;
            background: #1769e8;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-btn:hover {
            background: #0d47a1;
        }

        .forgot {
            display: block;
            margin: 15px;
            color: #1769e8;
            text-decoration: none;
            font-size: 14px;
        }

        .signup {
            margin-top: 20px;
            color: #555;
        }

        .signup a {
            color: #1769e8;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
  </head>
  <body>
   <form action="index4.html" method="get" target="_top">
    <div class="header">
      <div class="brand">
        <img src="logo.png" alt="SiyaHub Logo">
          <div>
            <h1>SiyaHub</h1>
            <p>Smart Tech. Better Choice.</p>
          </div>
        </div>
      </div>
     
      <div class="login-container">
        <div class="login-box">
          <h2>Welcome Back!</h2>
          <p>Login to your SiyaHub account</p>
          <form>
            <input type="email"
              placeholder="Enter Email" required>
              <input type="password"
                placeholder="Enter Password" required>
                <a href="#" class="forgot">
                  Forgot Password?
                </a>
                <button type="submit" class="login-btn">
                  Login
                </button>
              </form>
              <div class="signup">
                Don't have an account?
                <a href="#">Create Account</a>
              </div>
            </div>
          </div>
        </body>
      </html>
